name: Build Juiced ARM64 Linux
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-native-arm64:
    name: Build on Native ARM64 Runner
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout OpenJuice Repository
        uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            liblua5.4-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libgdk-pixbuf-2.0-dev libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev
      - name: Build and Install SDL3 from Source
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b main
          cd SDL
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build
          cd ..
      - name: Configure and Build Juiced
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target juiced -j$(nproc)
          strip build/juiced
      - name: Verify Architecture
        run: |
          file build/juiced
      - name: Archive Binary
        run: |
          tar -czvf juiced-arm64.tar.gz -C build juiced
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiced-arm64-native
          path: juiced-arm64.tar.gz
          retention-days: 14
  build-qemu-arm64:
    name: Build on QEMU ARM64 (Fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build inside ARM64 Container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/artifacts"
          install: |
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config git ca-certificates \
              liblua5.4-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
              libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
              libgdk-pixbuf-2.0-dev libasound2-dev libpulse-dev libx11-dev \
              libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
              libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev
          run: |
            git clone --depth 1 https://github.com/libsdl-org/SDL.git -b main
            cd SDL
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=ON -DSDL_TEST_LIBRARY=OFF
            cmake --build build -j$(nproc)
            cmake --install build
            cd ..
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build build --target juiced -j$(nproc)
            strip build/juiced
            file build/juiced
            tar -czvf artifacts/juiced-arm64-qemu.tar.gz -C build juiced
      - name: Upload Artifact (QEMU)
        uses: actions/upload-artifact@v4
        with:
          name: juiced-arm64-qemu
          path: artifacts/juiced-arm64-qemu.tar.gz
          retention-days: 14
