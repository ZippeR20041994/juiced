name: Build Juiced ARM64 Linux
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-arm64:
    name: Build Juiced ARM64 Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
      - name: Create Build Script
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/bash
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          # Enable deb-src and update
          sed -i 's/Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources || true
          apt-get update
          # Install all build dependencies
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            liblua5.4-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libgdk-pixbuf-2.0-dev libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libxss-dev libxxf86vm-dev libxtst-dev libxfixes-dev libxrandr-dev \
            libudev-dev libdbus-1-dev
          echo "=== Building SDL3 ==="
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b main
          cd SDL
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_X11_XSCRNSAVER=OFF \
            -DSDL_X11_XTEST=OFF
          cmake --build build -j$(nproc)
          cmake --install build
          cd ..
          echo "=== Building Juiced ==="
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build --target juiced -j$(nproc)
          strip build/juiced
          tar -czvf juiced-arm64.tar.gz -C build juiced
          EOF
          chmod +x run_build.sh
      - name: Run Build inside Ubuntu 24.04 ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" -w /workspace ubuntu:24.04 ./run_build.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiced-arm64
          path: juiced-arm64.tar.gz
          retention-days: 14
